name: UI resize check (temporary)

on: push

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx
      - name: Run the resize test five times under Xvfb
        run: |
          for i in 1 2 3 4 5; do
            RUN_UI_TESTS=true xvfb-run -a ./gradlew test --rerun-tasks \
              --tests 'seedu.address.ui.ContactCardsUiTest.window_liveResizing_keepsSelectedContactVisible' || exit 1
          done
      - name: Run all UI tests once
        run: RUN_UI_TESTS=true xvfb-run -a ./gradlew test --rerun-tasks --tests 'seedu.address.ui.*'
